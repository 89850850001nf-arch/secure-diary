name: Security Scan

on: [push, pull_request]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install tools
        run: |
          pip install bandit pip-audit
          
      - name: Run Bandit (SAST - Code Analysis)
        # Добавили --exit-zero, чтобы минорные баги не ломали сборку
        run: bandit -r . -x ./venv,./venv_jwt,./tests --exit-zero
        
      - name: Run pip-audit (SCA - Dependency Check)
        # Проверяем requirements.txt (если его нет, шаг просто пропустится)
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "Файл requirements.txt не найден, пропускаем."
          fi
