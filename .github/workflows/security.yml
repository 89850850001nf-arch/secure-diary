name: Security Scan

on: [push, pull_request]

jobs:
  bandit-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install Bandit
        run: pip install bandit
        
      - name: Run Bandit (Scan for vulnerabilities)
        # Сканируем код, исключая папки с виртуальными окружениями и тестами
        run: bandit -r . -x ./venv,./venv_jwt,./tests
